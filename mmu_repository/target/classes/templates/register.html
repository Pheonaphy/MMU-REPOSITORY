<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Multimedia University Repository | Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow-sm border-0" style="width: 100%; max-width: 450px;">
        <div class="card-header text-center fw-bold bg-dark text-white p-3">
            Account Registration Panel
        </div>
        <div class="card-body p-4">
            
            <div th:if="${param.error}" class="alert alert-danger py-2 small text-center">
                Registration failed. Please fill out all required parameters cleanly.
            </div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Username / Full Name</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter registration name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@mmu.ac.ke" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Security Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">Account Role Domain</label>
                    <select name="role" class="form-select">
                        <option value="STUDENT">Student User</option>
                        <option value="SUPERVISOR">Academic Supervisor</option>
                        <option value="SPONSOR">Corporate Sponsor</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-medium mb-3">Submit Request</button>
                <div class="text-center small">
                    Already registered? <a th:href="@{/}" class="text-decoration-none fw-bold">Sign In here</a>
                </div>
            </form>

# Server Port Configuration
server.port=8081

# PostgreSQL Database Connection Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mmu_research_repository
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# FIXED: Set to 'update' so Hibernate automatically builds your tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Sizes Configuration (Prevents crashes on PDF submittals)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB